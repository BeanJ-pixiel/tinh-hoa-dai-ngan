<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên Hệ - Tinh Hoa Đại Ngàn</title>
  <!-- Nhúng file CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header / Navigation đơn giản -->
  <header class="navbar">
    <div class="logo">Tinh Hoa Đại Ngàn</div>
    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="contact.html" class="active">Liên hệ</a>
    </nav>
  </header>

  <!-- Section Liên Hệ -->
  <main class="contact-section">
    <div class="container">
      <h2>Gửi Thắc Mắc & Góp Ý</h2>
      <p class="subtitle">Hãy để lại lời nhắn, chúng tôi sẽ phản hồi bạn sớm nhất!</p>

      <form id="contactForm" novalidate>
        <div class="form-group">
          <label for="fullname">Họ và tên</label>
          <input type="text" id="fullname" placeholder="Ví dụ: Trần Văn A">
          <small class="error-msg" id="nameError"></small>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="email@example.com">
          <small class="error-msg" id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="message">Nội dung liên hệ</label>
          <textarea id="message" rows="5" placeholder="Nhập lời nhắn của bạn..."></textarea>
          <small class="error-msg" id="messageError"></small>
        </div>

        <button type="submit" id="submitBtn">Gửi Liên Hệ</button>
      </form>

      <!-- Alert thông báo gửi thành công -->
      <div id="successAlert" class="alert-success hidden">
        🎉 Cảm ơn bạn! Thông tin liên hệ đã được gửi đi thành công.
      </div>
    </div>
  </main>

    <!-- Footer đơn giản -->
    <footer class="footer">
      <p>&copy; 2026 Tinh Hoa Đại Ngàn. All rights reserved.</p>
    </footer>
  <script src="js/main.js"></script>
</body>
</html>
